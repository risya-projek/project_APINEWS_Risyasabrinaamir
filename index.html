<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News API</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- ===== HEADER & NAVBAR ===== -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">LATEST NEWS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Kategori</a></li>
          </ul>

          <!-- Searching -->
          <form class="d-flex" role="search">
            <input id="searchInput" class="form-control me-2" type="search" placeholder="Cari berita..." aria-label="Search">
          </form>
        </div>
      </div>
    </nav>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="container my-4">
    <section id="news-section">
      <div class="row" id="news-container">
        <!-- Berita akan muncul di sini -->
      </div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="bg-dark text-light text-center py-3 mt-5">
    <p class="mb-1">© 2025 News | All rights reserved.</p>
    <a href="#" class="text-light me-2">Contact</a> |
    <a href="#" class="text-light ms-2">Instagram</a> |
    <a href="#" class="text-light ms-2">Twitter</a>
  </footer>

  <!-- Script Bootstrap & JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
